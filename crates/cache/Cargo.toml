[package]
name = "cached-client-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
log = "0.4.28"
quick-xml = { version = "0.38.3", features = ["serialize"] }
reqwest = { version = "0.12.23", features = ["json"], default-features = false }
rmp-serde = "1.3.0"
serde = "1.0.219"
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util"] }

[dev-dependencies]
base64 = "0.22.1"
tempfile = "3.22.0"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
wiremock = "0.6.5"
