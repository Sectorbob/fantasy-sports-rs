[package]
name = "yahoo-fantasy-rs"
version = "0.1.0"
edition = "2024"
exclude = ["notes/*"]
authors = ["Sectorbob"]

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
itertools = "0.14.0"
pkce = "0.2.0" # For OAuth2
quick-xml = { version = "0.37.5", features = ["serialize"] }
reqwest = { version = "0.12.15", features = ["json"] }  # For HTTP requests
serde = { version = "1.0.219", features = ["derive"] } # For serialization/deserialization
serde-xml-rs = "0.8.0" # For XML serialization/deserialization
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["full"] } # For async runtime

[dev-dependencies]
dotenv = "0.15.0"
wiremock = "0.6.3"
