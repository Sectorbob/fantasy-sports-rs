[package]
name = "sleeper-fantasy-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4.41", features = [ "serde" ] }
directories = "6.0.0"
log = "0.4.27"
reqwest = { version = "0.12.15", features = [ "gzip", "json" ] }
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = { version = "1.0.140" }
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = [ "full" ] }

[features]
default = []

[dev-dependencies]
flate2 = "1.1.1"
wiremock = "0.6.3"
