[package]
name = "sleeper-fantasy-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = [ "serde" ] }
reqwest = { version = "0.12.15", features = [ "json" ] }
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = { version = "1.0.140" }
tokio = { version = "1.45.0", features = [ "full" ] }
