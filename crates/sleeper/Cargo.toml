[package]
name = "fantasy-sports-sleeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust client for the Sleeper fantasy sports API"
readme = "README.md"
keywords = ["sleeper", "fantasy", "football", "sports", "api"]
categories = ["api-bindings"]
exclude = ["testdata/**"]

[dependencies]
fantasy-sports-cache.workspace = true
chrono = { workspace = true, features = ["serde"] }
directories.workspace = true
log.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["gzip", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_repr.workspace = true
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
flate2.workspace = true
wiremock.workspace = true

[features]
default = []
