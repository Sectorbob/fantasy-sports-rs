# gitleaks configuration: `gitleaks git .` (history) or `gitleaks dir .` (working tree)
title = "fantasy-sports-rs"

[extend]
useDefault = true

# apps/sectorbot lived in this repository until it moved to its own one, and its history is still
# here. The `discord-client-id` rule fires on the word "discord" near any long number; these are
# the only two historical places it does, and neither is a credential: a placeholder channel id
# in an example feeds file and a fake (pseudonymized) id in a server test.
[[allowlists]]
description = "placeholder and fake discord ids in the moved-out sectorbot"
condition = "OR"
paths = [
    '''apps/sectorbot/feeds\.example\.json''',
    '''apps/sectorbot/src/server\.rs''',
]
