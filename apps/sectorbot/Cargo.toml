[package]
name = "sectorbot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
chrono = "0.4.41"
chrono-tz = "0.10.4"
dotenv = "0.15.0"
html-escape = "0.2.13"
log = "0.4.27"
num = "0.4.3"
num-traits = "0.2.19"
radix_fmt = "1.0.0"
regex = "1.11.1"
reqwest = { version = "0.12.22", features = ["json", "rustls-tls"], default-features = false }
rss = "2.0.12"
serde =  { version = "1.0.219", features = ["derive", "alloc"] }
serde_json = "1.0.140"
serenity = "0.12.4"
sled = "0.34.7"
sleeper-fantasy-rs = { version = "0.1.0", path = "../sleeper-fantasy-rs" }
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.19"

[dev-dependencies]
wiremock = "0.6.4"
