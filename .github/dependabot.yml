version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the tag of this action IS the Rust version it installs (the MSRV job pins 1.88.0 on
      # purpose), so a "newer version" would silently move the minimum supported Rust version
      - dependency-name: "dtolnay/rust-toolchain"
