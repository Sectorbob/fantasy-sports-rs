# cargo-deny policy: `cargo deny check`
#
# Every exception below is deliberate and written down with its reason. Re-review them when
# sled is updated (it is the only source of the exceptions).

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # sled 0.34 (the player cache) depends on these unmaintained crates.
    { id = "RUSTSEC-2025-0057", reason = "fxhash, unmaintained, via sled" },
    { id = "RUSTSEC-2024-0384", reason = "instant, unmaintained, via sled" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
